<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Game Hub Intro</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
}

/* BACKGROUND */
#bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
}

/* LOGO */
#logo{
    width:180px;
    animation:logoAnim 2s ease;
    filter:drop-shadow(0 0 25px cyan);
    transition:0.5s;
}

/* TITLE */
h1{
    margin-top:20px;
    font-size:45px;
    color:cyan;
    text-shadow:
    0 0 10px cyan,
    0 0 20px cyan,
    0 0 40px blue;
    animation:fadeIn 2s ease;
}

p{
    margin-top:10px;
    opacity:0.8;
    font-size:18px;
}

/* START BUTTON */
#startBtn{
    margin-top:35px;
    padding:15px 40px;
    font-size:20px;
    border:none;
    border-radius:50px;
    background:linear-gradient(45deg, cyan, blue);
    color:white;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 0 20px cyan;
    transition:0.3s;
}

#startBtn:hover{
    transform:scale(1.1);
    box-shadow:0 0 35px cyan;
}

/* LOADER */
.loader{
    width:350px;
    height:14px;
    background:#111;
    margin-top:35px;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 15px cyan;
}

.loader div{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, cyan, blue);
    border-radius:20px;
}

/* MOBILE */
@media(max-width:768px){

    #logo{
        width:130px;
    }

    h1{
        font-size:30px;
        text-align:center;
        padding:0 10px;
    }

    p{
        font-size:15px;
    }

    .loader{
        width:85%;
    }

    #startBtn{
        font-size:18px;
        padding:12px 30px;
    }

}

/* ANIMATIONS */

@keyframes logoAnim{
    from{
        transform:scale(0) rotate(360deg);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<img src="assets/images/logo.png" id="logo">

<h1>WELCOME TO MINI GAME HUB 🎮</h1>

<p>Presented by Lakshay Garg & Kunal Sharma</p>

<button id="startBtn">START GAME</button>

<div class="loader">
    <div id="progress"></div>
</div>

<!-- AUDIO -->

<audio id="voiceIntro">
    <source src="assets/sounds/voice.mp3" type="audio/mp3">
</audio>

<audio id="bgMusic" loop>
    <source src="assets/sounds/intro.mp3" type="audio/mp3">
</audio>

<script>

/* =========================
   PARTICLES BACKGROUND
========================= */

const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0;i<120;i++){

    particles.push({

        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*2.5,
        dx:(Math.random()-0.5),
        dy:(Math.random()-0.5)

    });

}

function animateParticles(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="cyan";

    particles.forEach(p=>{

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();

        p.x += p.dx;
        p.y += p.dy;

        if(p.x<0 || p.x>canvas.width) p.dx *= -1;
        if(p.y<0 || p.y>canvas.height) p.dy *= -1;

    });

    requestAnimationFrame(animateParticles);

}

animateParticles();

/* =========================
   INTRO SYSTEM
========================= */

const startBtn = document.getElementById("startBtn");
const voice = document.getElementById("voiceIntro");
const bgMusic = document.getElementById("bgMusic");
const logo = document.getElementById("logo");
const progress = document.getElementById("progress");

let started = false;

startBtn.addEventListener("click", startExperience);

function startExperience(){

    if(started) return;
    started = true;

    startBtn.style.display = "none";

    // volumes
    voice.volume = 1;
    bgMusic.volume = 0.35;

    // play intro voice
    voice.play().then(()=>{

        // logo effect
        logo.style.transform = "scale(1.2)";

        // loader animation
        let width = 0;

        let load = setInterval(()=>{

            width++;

            progress.style.width = width + "%";

            if(width >= 100){

                clearInterval(load);

            }

        },90);

        // when voice ends
        voice.onended = ()=>{

            logo.style.transform = "scale(1)";

            // background music
            bgMusic.play();

            // redirect
            setTimeout(()=>{

                window.location.href = "index.html";

            },2500);

        };

    }).catch(err=>{

        console.log("Audio Error:", err);

        // backup redirect
        setTimeout(()=>{

            window.location.href = "index.html";

        },5000);

    });

}

/* =========================
   RESIZE
========================= */

window.addEventListener("resize", ()=>{

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

});

</script>

</body>
</html>
