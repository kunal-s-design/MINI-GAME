<!DOCTYPE html>
<html>
<head>
  <title>Tic Tac Toe</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div id="startScreen" class="center-box">

  <h1>❌⭕ Tic Tac Toe</h1>

  <select id="mode">
    <option value="computer">Single Player</option>
    <option value="two">2 Player</option>
  </select>

  <br><br>

  <button onclick="startGame()">▶ Start Game</button>

</div>

<div id="gameUI" style="display:none;">

  <div class="game-header">
    <div id="status">Player X Turn</div>
  </div>

  <div class="tic-board" id="board"></div>

  <div class="game-buttons">
    <button onclick="restartGame()">🔄 Restart</button>
    <button onclick="window.location.href='index.html'">🏠 Home</button>
  </div>

</div>

<script src="js/tictac.js"></script>

</body>
</html>
