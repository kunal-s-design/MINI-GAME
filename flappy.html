<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird: Pro Edition with Difficulty</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            overflow: hidden;
            border: 4px solid #333;
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #38bdf8, #bae6fd);
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        #start-screen, #game-over-screen {
            background: rgba(0, 0, 0, 0.65);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .hide {
            display: none !important;
        }
        h1 {
            font-size: 3rem;
            color: #facc15;
            text-shadow: 3px 3px 0px #000;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: bounce 2s infinite;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #e2e8f0;
            text-shadow: 1px 1px 2px #000;
        }
        
        /* Difficulty Selector Style */
        .difficulty-container {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            pointer-events: auto;
        }
        .diff-btn {
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            border: 2px solid #444;
            background: #222;
            color: #aaa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .diff-btn:hover {
            color: #fff;
            border-color: #888;
        }
        .diff-btn.active[data-diff="easy"] { background: #16a34a; color: white; border-color: #22c55e; box-shadow: 0 0 15px rgba(34,197,94,0.5); }
        .diff-btn.active[data-diff="medium"] { background: #d97706; color: white; border-color: #f59e0b; box-shadow: 0 0 15px rgba(245,158,11,0.5); }
        .diff-btn.active[data-diff="hard"] { background: #dc2626; color: white; border-color: #ef4444; box-shadow: 0 0 15px rgba(239,68,68,0.5); }

        .btn {
            padding: 12px 45px;
            font-size: 1.5rem;
            font-weight: bold;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0px #15803d, 0 10px 20px rgba(0,0,0,0.4);
            pointer-events: auto;
            transition: all 0.1s ease;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0px #15803d, 0 5px 10px rgba(0,0,0,0.4);
        }
        #score-display {
            position: absolute;
            top: 20px;
            font-size: 3.5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
            z-index: 10;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score-display" class="hide">0</div>
        
        <!-- Canvas for heavy graphics -->
        <canvas id="gameCanvas" width="480" height="640"></canvas>

        <!-- UI Overlay -->
        <div class="ui-layer">
            <div id="start-screen">
                <h1>Flappy Pro</h1>
                <p>Select Difficulty & Press Play</p>
                
                <!-- Difficulty Selection -->
                <div class="difficulty-container">
                    <button class="diff-btn" data-diff="easy" onclick="setDifficulty('easy')">EASY</button>
                    <button class="diff-btn active" data-diff="medium" onclick="setDifficulty('medium')">MEDIUM</button>
                    <button class="diff-btn" data-diff="hard" onclick="setDifficulty('hard')">HARD</button>
                </div>

                <button class="btn" onclick="startGame()">PLAY</button>
            </div>
            
            <div id="game-over-screen" class="hide">
                <h1>Game Over</h1>
                <p id="final-score">Score: 0</p>
                <p id="high-score">Best: 0</p>
                <button class="btn" onclick="startGame()">TRY AGAIN</button>
            </div>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const scoreDisplay = document.getElementById('score-display');
const finalScoreTxt = document.getElementById('final-score');
const highScoreTxt = document.getElementById('high-score');

// Game States & Difficulty Settings
let gameState = 'START'; 
let score = 0;
let currentDifficulty = 'medium';

const difficultySettings = {
    easy: { pipeGap: 170, pipeSpeed: 2.5, spawnDist: 240 },
    medium: { pipeGap: 140, pipeSpeed: 3.5, spawnDist: 220 },
    hard: { pipeGap: 115, pipeSpeed: 4.5, spawnDist: 190 }
};

let highScore = JSON.parse(localStorage.getItem('flappyProHighScores')) || { easy: 0, medium: 0, hard: 0 };
let animationFrameId;
let screenShake = 0;

// Set Difficulty Function
function setDifficulty(level) {
    currentDifficulty = level;
    document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.classList.remove('active');
        if(btn.getAttribute('data-diff') === level) {
            btn.classList.add('active');
        }
    });
    playSound('score'); // Small feedback sound
}

// Sound FX Generator
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'flap') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'score') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
}

// Scenery Arrays
let bgClouds = [{x: 0}, {x: 240}, {x: 480}];

// Bird Object
const bird = {
    x: 80,
    y: 300,
    radius: 16,
    velocity: 0,
    gravity: 0.4,
    jump: -7.5,
    rotation: 0,
    wingCycle: 0,
    
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        // Body Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath(); ctx.arc(3, 5, this.radius, 0, Math.PI * 2); ctx.fill();

        // Main Bird Body Gradient
        let grad = ctx.createRadialGradient(-3, -3, 2, 0, 0, this.radius);
        grad.addColorStop(0, '#fef08a');
        grad.addColorStop(1, '#eab308');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5; ctx.stroke();

        // Eye
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(6, -5, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(8, -5, 2, 0, Math.PI * 2); ctx.fill();

        // Beak
        ctx.fillStyle = '#f97316';
        ctx.beginPath(); ctx.moveTo(12, -2); ctx.lineTo(22, 2); ctx.lineTo(12, 6); ctx.closePath(); ctx.fill(); ctx.stroke();

        // Wing Animation
        ctx.save();
        ctx.translate(-6, 2);
        ctx.rotate(Math.sin(this.wingCycle) * 0.6);
        ctx.fillStyle = '#facc15';
        ctx.beginPath(); ctx.ellipse(0, 0, 10, 6, Math.PI/4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.restore();

        ctx.restore();
    },
    update() {
        this.wingCycle += (this.velocity < 0) ? 0.5 : 0.1;
        this.velocity += this.gravity;
        this.y += this.velocity;

        if (this.velocity < 0) {
            this.rotation = Math.max(-0.4, this.velocity * 0.08);
        } else {
            this.rotation = Math.min(1.2, this.velocity * 0.06);
        }

        if (this.y + this.radius >= canvas.height - 80) {
            this.y = canvas.height - 80 - this.radius;
            if(gameState === 'PLAYING') {
                screenShake = 12;
                playSound('hit');
                createParticles(this.x, this.y, '#ef4444', 25);
                endGame();
            }
        }
        if (this.y - this.radius <= 0) {
            this.y = this.radius;
            this.velocity = 0.5;
        }
    },
    flap() {
        this.velocity = this.jump;
        playSound('flap');
        createParticles(this.x - 10, this.y, '#fff', 3);
    }
};

let pipes = [];
let particles = [];

class Pipe {
    constructor(x) {
        this.settings = difficultySettings[currentDifficulty];
        this.x = x;
        this.topHeight = Math.floor(Math.random() * (canvas.height - 320)) + 60;
        this.gap = this.settings.pipeGap;
        this.bottomHeight = canvas.height - 80 - (this.topHeight + this.gap);
        this.width = 72;
        this.passed = false;
    }
    draw() {
        ctx.save();
        let grad = ctx.createLinearGradient(this.x, 0, this.x + this.width, 0);
        grad.addColorStop(0, '#22c55e');
        grad.addColorStop(0.3, '#4ade80');
        grad.addColorStop(1, '#15803d');

        ctx.fillStyle = grad;
        ctx.strokeStyle = '#052e16';
        ctx.lineWidth = 3;

        // Top Pipe
        ctx.fillRect(this.x, 0, this.width, this.topHeight);
        ctx.strokeRect(this.x, -5, this.width, this.topHeight + 5);
        ctx.fillRect(this.x - 4, this.topHeight - 24, this.width + 8, 24);
        ctx.strokeRect(this.x - 4, this.topHeight - 24, this.width + 8, 24);

        // Bottom Pipe
        let bY = canvas.height - 80 - this.bottomHeight;
        ctx.fillRect(this.x, bY, this.width, this.bottomHeight);
        ctx.strokeRect(this.x, bY, this.width, this.bottomHeight + 5);
        ctx.fillRect(this.x - 4, bY, this.width + 8, 24);
        ctx.strokeRect(this.x - 4, bY, this.width + 8, 24);

        ctx.restore();
    }
    update() {
        this.x -= this.settings.pipeSpeed;
    }
}

function createParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            radius: Math.random() * 4 + 2,
            color: color,
            alpha: 1
        });
    }
}

function handleParticles() {
    for(let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.alpha -= 0.03;
        if(p.alpha <= 0) { particles.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }
}

function drawScenery() {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    bgClouds.forEach(cloud => {
        if (gameState === 'PLAYING') cloud.x -= 0.5;
        if (cloud.x <= -240) cloud.x = canvas.width;
        ctx.beginPath();
        ctx.arc(cloud.x, 120, 30, 0, Math.PI*2);
        ctx.arc(cloud.x + 25, 110, 40, 0, Math.PI*2);
        ctx.arc(cloud.x + 55, 120, 25, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.fillStyle = '#93c5fd';
    ctx.fillRect(0, canvas.height - 140, canvas.width, 60);
}

function drawGround() {
    let gY = canvas.height - 80;
    ctx.save();
    let groundGrad = ctx.createLinearGradient(0, gY, 0, canvas.height);
    groundGrad.addColorStop(0, '#eab308');
    groundGrad.addColorStop(1, '#ca8a04');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, gY, canvas.width, 80);
    ctx.fillStyle = '#166534';
    ctx.fillRect(0, gY, canvas.width, 12);
    ctx.fillStyle = '#14532d';
    ctx.fillRect(0, gY+12, canvas.width, 4);
    ctx.restore();
}

function checkCollision(b, p) {
    if (b.x + b.radius - 3 > p.x && b.x - b.radius + 3 < p.x + p.width) {
        if (b.y - b.radius + 3 < p.topHeight || b.y + b.radius - 3 > canvas.height - 80 - p.bottomHeight) {
            return true;
        }
    }
    return false;
}

// Main Engine Loop
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    if (screenShake > 0) {
        let dx = (Math.random() - 0.5) * screenShake;
        let dy = (Math.random() - 0.5) * screenShake;
        ctx.translate(dx, dy);
        screenShake *= 0.9;
        if(screenShake < 0.5) screenShake = 0;
    }

    drawScenery();

    let currentSettings = difficultySettings[currentDifficulty];

    if (gameState === 'PLAYING') {
        if (pipes.length === 0 || pipes[pipes.length - 1].x <= canvas.width - currentSettings.spawnDist) {
            pipes.push(new Pipe(canvas.width));
        }
    }

    for (let i = pipes.length - 1; i >= 0; i--) {
        let p = pipes[i];
        if (gameState === 'PLAYING') p.update();
        p.draw();

        if (!p.passed && p.x + p.width / 2 < bird.x) {
            score++;
            p.passed = true;
            scoreDisplay.textContent = score;
            playSound('score');
            createParticles(bird.x, bird.y, '#facc15', 8);
        }

        if (gameState === 'PLAYING' && checkCollision(bird, p)) {
            screenShake = 12;
            playSound('hit');
            createParticles(bird.x, bird.y, '#ef4444', 25);
            endGame();
        }

        if (p.x + p.width < 0) pipes.splice(i, 1);
    }

    if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
        bird.update();
    }
    bird.draw();
    handleParticles();
    drawGround();

    ctx.restore();
    animationFrameId = requestAnimationFrame(gameLoop);
}

function startGame() {
    gameState = 'PLAYING';
    score = 0;
    pipes = [];
    particles = [];
    bird.y = 300;
    bird.velocity = 0;
    bird.rotation = 0;
    
    scoreDisplay.textContent = score;
    startScreen.classList.add('hide');
    gameOverScreen.classList.add('hide');
    scoreDisplay.classList.remove('hide');
}

function endGame() {
    gameState = 'GAMEOVER';
    
    // High score save based on selected difficulty
    if (score > highScore[currentDifficulty]) {
        highScore[currentDifficulty] = score;
        localStorage.setItem('flappyProHighScores', JSON.stringify(highScore));
    }
    
    finalScoreTxt.textContent = `Score: ${score} (${currentDifficulty.toUpperCase()})`;
    highScoreTxt.textContent = `Best in ${currentDifficulty.toUpperCase()}: ${highScore[currentDifficulty]}`;
    
    scoreDisplay.classList.add('hide');
    gameOverScreen.classList.remove('hide');
}

// Input Handlers
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        if (gameState === 'PLAYING') bird.flap();
        else if (gameState === 'START') startGame();
    }
});

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (gameState === 'PLAYING') bird.flap();
});

gameLoop();
</script>
</body>
</html>
